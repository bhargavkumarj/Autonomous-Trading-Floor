[project]
name = "autonomous-trading-floor"
version = "1.0.0"
description = "Four autonomous LLM traders coordinated over the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.15.1",
    "openai>=2.34.0",
    "mcp>=1.2.0,<2",
    "massive>=2.8.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "gradio>=6.14.0",
    "plotly>=6.8.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
trading-floor = "trading_floor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_floor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# Defaults plus import sorting. Deliberately not the "select everything" set:
# this codebase catches broad exceptions and uses naive local timestamps on
# purpose, and a linter that flags those trains you to ignore it.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["trading_floor"]
